appId: com.partscout.desktop
productName: Part Scout
asar: true
directories:
  output: release
  buildResources: build
files:
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/server.cjs
  - public/**
  - build/icon.ico
  - package.json
  - '!node_modules/**'
win:
  target:
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  signExecutable: false
portable:
  artifactName: Part-Scout-${version}-Windows-x64.exe
  requestExecutionLevel: user
electronLanguages: [en-US]
